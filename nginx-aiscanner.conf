# /etc/nginx/sites-available/aiscanner.abelsoftware123.com
# Rate limit op de scan-endpoints: 10 verzoeken per minuut per IP
limit_req_zone $binary_remote_addr zone=aiscanner:10m rate=10r/m;

server {
    listen 80;
    listen [::]:80;
    server_name aiscanner.abelsoftware123.com;

    # Ruimte voor zip-uploads en mappen (zelfde waarde als MAX_UPLOAD_MB in de app)
    client_max_body_size 10m;

    # De app is zonder inlog bereikbaar. Wil je er later een wachtwoord voor zetten?
    # Haal dan de # weg en maak het bestand met: sudo htpasswd -c /etc/nginx/.htpasswd-aiscanner abel
    # auth_basic           "AI Scanner";
    # auth_basic_user_file /etc/nginx/.htpasswd-aiscanner;

    # Gemeenschappelijke proxy-instellingen (scans kunnen minuten duren)
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 330s;
    proxy_send_timeout 330s;

    # Zware endpoints: met rate limit
    location ~ ^/api/(scan|scan-project)$ {
        limit_req zone=aiscanner burst=5 nodelay;
        proxy_pass http://127.0.0.1:8976;
    }

    location / {
        proxy_pass http://127.0.0.1:8976;
    }
}
